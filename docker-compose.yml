services:
  api:
    build:
      context: .
      args:
        - ENVIRONMENT=development
    container_name: solesearch_api
    depends_on:
      - db
      - redis
    volumes:
      - ~/solesearch/api/data:/var/data/solesearch
    networks:
      - solesearch_network
    restart: always
    env_file:
      - ".env"

  celery_worker:
    build:
      context: .
      args:
        - ENVIRONMENT=development
    container_name: solesearch_worker
    command: celery -A solesearch_api.tasks worker --loglevel=info
    depends_on:
      - api
      - redis
      - rabbitmq
    volumes:
      - ~/solesearch/api/data:/var/data/solesearch
    networks:
      - solesearch_network
    restart: always
    env_file:
      - ".env"

  celery_beat:
    build:
      context: .
      args:
        - ENVIRONMENT=development
    container_name: solesearch_beat
    command: celery -A solesearch_api.tasks beat --loglevel=info
    depends_on:
      - api
      - redis
      - rabbitmq
    volumes:
      - ~/solesearch/api/data:/var/data/solesearch
    networks:
      - solesearch_network
    restart: always
    env_file:
      - ".env"

  db:
    image: postgres:16-alpine
    container_name: solesearch_db
    env_file:
      - ".env"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - solesearch_network
    restart: always

  redis:
    image: redis:alpine
    container_name: solesearch_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - solesearch_network
    restart: always

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: solesearch_rabbitmq
    ports:
      - "15672:15672"
    networks:
      - solesearch_network
    restart: always
    env_file:
      - ".env"

volumes:
  postgres_data:
  redis_data:


networks:
  solesearch_network:
    driver: bridge
