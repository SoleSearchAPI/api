version: "3.8"

services:
  api:
    container_name: solesearch_api
    build:
      context: .
      args:
        - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ~/solesearch/api/data:/var/data/solesearch
      - ~/Code/personal/api/src:/app/src
    networks:
      - solesearch_network
    depends_on:
      - db
      - redis
    restart: always
    env_file:
      - ".env"

  celery_worker:
    container_name: solesearch_worker
    build:
      context: .
      args:
        - ENVIRONMENT=development
    command: watchmedo auto-restart --directory=./src/solesearch_api --pattern=*.py --recursive -- celery -A solesearch_api.tasks worker --loglevel=info
    volumes:
      - ~/solesearch/api/data:/var/data/solesearch
      - ~/Code/personal/api/src:/app/src
    networks:
      - solesearch_network
    depends_on:
      - api
      - redis
      - rabbitmq
    restart: always
    env_file:
      - ".env"

  celery_beat:
    container_name: solesearch_beat
    build:
      context: .
      args:
        - ENVIRONMENT=development
    command: watchmedo auto-restart --directory=./src/solesearch_api --pattern=*.py --recursive -- celery -A solesearch_api.tasks beat --loglevel=info
    volumes:
      - ~/solesearch/api/data:/var/data/solesearch
      - ~/Code/personal/api/src:/app/src
    networks:
      - solesearch_network
    depends_on:
      - api
      - redis
      - rabbitmq
    restart: always
    env_file:
      - ".env"

  db:
    container_name: solesearch_db
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - solesearch_network
    restart: always
    env_file:
      - ".env"
    

  redis:
    container_name: solesearch_redis
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - solesearch_network
    restart: always

  rabbitmq:
    container_name: solesearch_rabbitmq
    image: rabbitmq:management-alpine
    ports:
      - "15672:15672"
    networks:
      - solesearch_network
    restart: always
    env_file:
      - ".env"

volumes:
  postgres_data:
  redis_data:


networks:
  solesearch_network:
    driver: bridge
