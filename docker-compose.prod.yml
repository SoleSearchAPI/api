version: "3.8"

services:
  api:
    container_name: solesearch_api
    image: peterrauscher/solesearch-api:v3.0.1
    volumes:
      - ~/solesearch/api/data:/var/data/solesearch
    networks:
      - solesearch_network
    depends_on:
      - db
      - redis
    restart: always
    env_file:
      - ".env"

  celery_worker:
    container_name: solesearch_worker
    image: peterrauscher/solesearch-api:v3.0.1
    command: celery -A solesearch_api.tasks worker --loglevel=info
    volumes:
      - ~/solesearch/api/data:/var/data/solesearch
    networks:
      - solesearch_network
    depends_on:
      - api
      - redis
      - rabbitmq
    restart: always
    env_file:
      - ".env"

  celery_beat:
    container_name: solesearch_beat
    image: peterrauscher/solesearch-api:v3.0.1
    command: celery -A solesearch_api.tasks beat --loglevel=info
    volumes:
      - ~/solesearch/api/data:/var/data/solesearch
    networks:
      - solesearch_network
    depends_on:
      - api
      - redis
      - rabbitmq
    restart: always
    env_file:
      - ".env"

  db:
    container_name: solesearch_db
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - solesearch_network
    restart: always
    env_file:
      - ".env"

  redis:
    container_name: solesearch_redis
    image: redis:alpine
    volumes:
      - redis_data:/data
    networks:
      - solesearch_network
    restart: always

  rabbitmq:
    container_name: solesearch_rabbitmq
    image: rabbitmq:management-alpine
    ports:
      - "15672:15672"
    networks:
      - solesearch_network
    restart: always
    env_file:
      - ".env"

  nginx:
    image: nginx:alpine
    container_name: solesearch_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/certbot/etc/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot/var/www/certbot:/var/www/certbot
    networks:
      - solesearch_network
    depends_on:
      - api
    restart: always
    env_file:
      - ".env"

  certbot:
    image: certbot/certbot:latest
    container_name: solesearch_certbot
    command: certonly --reinstall --webroot --webroot-path=/var/www/certbot --email ${EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}
    volumes:
      - ./nginx/certbot/etc/letsencrypt:/etc/letsencrypt
      - ./nginx/certbot/var/www/certbot:/var/www/certbot
    depends_on:
      - nginx
    restart: unless-stopped
    env_file:
      - ".env"

volumes:
  postgres_data:
  redis_data:


networks:
  solesearch_network:
    driver: bridge
